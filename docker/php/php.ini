; errors
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; file uploads
file_uploads = On
upload_max_filesize = 8M
post_max_size = 10M
max_file_uploads = 5

; execution
max_execution_time = 30
memory_limit = 128M

; security
expose_php = Off

; session
session.cookie_httponly = 1
session.cookie_samesite = Lax